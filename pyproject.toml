[project]
name = "docbuilder-mobile"
version = "1.0.0"
description = "Mobile document generator"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-permission-handler==1.1.2",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.1",
    "lxml>=5.3.0",
]

[dependency-groups]
dev = [
    "flet[all]>=1.1.2",
]

[tool.flet]
org = "com.example"
product = "DocBuilder Mobile"
company = "Example"
copyright = "Copyright (C) 2026 Example"

[tool.flet.app]
module = "main"
exclude = [
    "node_modules",
    "dist",
    "src",
    "public",
    "server.ts",
    "package.json",
    "package-lock.json",
    "bun.lock",
    "tsconfig.json",
    "vite.config.ts",
    "index.html",
    "metadata.json",
]

[tool.flet.android]
[tool.flet.android.permission]
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
