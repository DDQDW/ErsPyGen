name: Build PyDocx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flet APK (arm64-v8a)
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          args: "--arch arm64-v8a"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyDocx-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flet Windows
        id: build_win
        uses: flet-dev/flet-build-action@v1
        with:
          target: windows
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyDocx-Windows
          path: ${{ steps.build_win.outputs.archive-path }}
          archive: false
          if-no-files-found: error
