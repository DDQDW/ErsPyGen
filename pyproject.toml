[project]
name = "docbuilder-mobile"
version = "1.0.0"
description = "Mobile document generator"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.1",
    "lxml>=5.3.0",
]

[dependency-groups]
dev = [
    "flet[all]>=1.1.2",
]

[tool.flet]
app_name = "DocBuilder"
package_name = "com.example.docbuilder"
product_name = "DocBuilder Mobile"
company_name = "Example"
copyright = "Copyright (C) 2026 Example"

[tool.flet.android]
[tool.flet.android.permission]
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
